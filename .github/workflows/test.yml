name: test
# Runs on pull requests and on pushes to main: the public copy under BeatOctant takes no pull requests, so a push to
# main is where it is tested there. Documents and spikes/ are skipped, and a newer push to the same ref cancels the
# older run.
on:
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "spikes/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "spikes/**"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"  # the newest 3.11 (requires-python is >=3.11.4)
          cache: pip
          cache-dependency-path: pyproject.toml
      # Without the embed, gpu and vocal extras: the tests need no torch or audio models (test_audio skips without soundfile).
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
