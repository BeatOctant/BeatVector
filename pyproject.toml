[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octantvector"
version = "0.10.0"
description = "Vector DB generation and recommendation over a local BeatSaver map archive (a library for OctantHarvest and OctantCompass)"
readme = "README.md"
requires-python = ">=3.11.4"  # tarfile extraction filters (runtime/update.py)
dependencies = ["numpy>=1.26", "pyarrow>=14", "cryptography>=42", "rfc8785>=0.1.4"]  # pyarrow: the distributed DB tables (contract 2 (DB build to recommendation core)); cryptography, rfc8785: its signature (contract 5 (OctantHarvest to OctantCompass))

[project.optional-dependencies]
# reading songs (librosa: the ffmpeg fallback of archive.decode_audio) and running audio views (models come from
# plugins); search/eval run on numpy alone (torch is used if present)
embed = ["torch>=2.2", "soundfile>=0.12", "soxr>=0.3", "librosa>=0.10"]
vocal = ["demucs==4.1.0", "pyyaml>=6"]  # the vocal stem of stem = "vocal" views (encoders/stem.py); pyyaml reads htdemucs.yaml
dev = ["pytest>=8"]

[project.scripts]
octantvector = "octantvector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
